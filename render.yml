services:
  - type: web
    name: master-lexicon-v4
    env: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT app:app

    envVars:
      - key: FLASK_ENV
        value: production

      - key: DATABASE_URL
        fromDatabase:
          name: masterlexicon-db
          property: connectionString

databases:
  - name: masterlexicon-db
    plan: free
