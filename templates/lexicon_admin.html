<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Master Lexicon Admin Panel</title>

    <link rel="stylesheet" href="/static/style.css">

    <style>
        body {
            background: #121212;
            color: #eee;
            font-family: Arial, sans-serif;
            padding: 20px;
        }
        h1 {
            text-align: center;
            color: #00ffcc;
        }
        .top-buttons {
            margin-bottom: 20px;
        }
        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
            margin-right: 10px;
        }
        .btn-add { background: #00ffcc; color: #000; }
        .btn-csv { background: #ffaa00; color: #000; }
        .btn-excel { background: #0099ff; color: #fff; }
        .btn-pdf { background: #ff4444; color: #fff; }

        #searchInput {
            width: 300px;
            padding: 10px;
            margin-bottom: 15px;
            border-radius: 6px;
            border: none;
        }
        table {
            width: 100%;
            border-collapse: collapse;
            background: #1e1e1e;
            border-radius: 8px;
            overflow: hidden;
        }
        th, td {
            padding: 12px;
            border-bottom: 1px solid #333;
        }
        th {
            background: #00ffcc;
            color: #000;
        }
        .btn-edit { background: #00aaff; color: #fff; }
        .btn-delete { background: #ff4444; color: #fff; }

        #pagination {
            margin-top: 20px;
            text-align: center;
        }
        #pagination button {
            padding: 8px 16px;
            margin: 5px;
            border: none;
            border-radius: 6px;
            background: #00ffcc;
            color: #000;
            cursor: pointer;
            font-weight: bold;
        }

        /* MODAL */
        .modal {
            display: none;
            position: fixed;
            top: 0; left: 0;
            width: 100%; height: 100%;
            background: rgba(0,0,0,0.7);
            justify-content: center;
            align-items: center;
        }
        .modal-content {
            background: #1e1e1e;
            padding: 20px;
            border-radius: 10px;
            width: 350px;
            text-align: center;
        }
        .modal-content input {
            width: 90%;
            padding: 10px;
            margin: 8px 0;
            border-radius: 6px;
            border: none;
        }
        .modal-content button {
            padding: 10px 20px;
            margin: 10px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-weight: bold;
        }
        .close-btn { background: #ff4444; color: #fff; }
        #modalActionBtn { background: #00ffcc; color: #000; }

        /* TOAST */
        .toast {
            position: fixed;
            bottom: 20px;
            right: 20px;
            background: #00ffcc;
            color: #000;
            padding: 10px 20px;
            border-radius: 8px;
            font-weight: bold;
            animation: fadeInOut 3s ease;
        }
        @keyframes fadeInOut {
            0% { opacity: 0; transform: translateY(20px); }
            10% { opacity: 1; transform: translateY(0); }
            90% { opacity: 1; }
            100% { opacity: 0; transform: translateY(20px); }
        }
    </style>
</head>

<body>

    <h1>Master Lexicon Admin Panel</h1>

    <div class="top-buttons">
        <button class="btn btn-add" onclick="openAddModal()">+ Add Entry</button>
        <button class="btn btn-csv" onclick="exportCSV()">Export CSV</button>
        <button class="btn btn-excel" onclick="exportExcel()">Export Excel</button>
        <button class="btn btn-pdf" onclick="exportPDF()">Export PDF</button>
    </div>

    <input id="searchInput" onkeyup="filterTable()" placeholder="Search entries...">

    <table id="lexiconTable">
        <thead>
            <tr>
                <th>English</th>
                <th>Swahili</th>
                <th>Category</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody></tbody>
    </table>

    <div id="pagination"></div>

    <!-- ONE UNIFIED MODAL -->
    <div id="mainModal" class="modal">
        <div class="modal-content">
            <h3 id="modalTitle">Add Entry</h3>

            <div id="modalFields">
                <input id="modalEnglish" placeholder="English">
                <input id="modalSwahili" placeholder="Swahili">
                <input id="modalCategory" placeholder="Category">
            </div>

            <div id="deleteConfirm" style="display:none;">
                <p>Are you sure you want to delete this entry?</p>
            </div>

            <button id="modalActionBtn">Save</button>
            <button class="close-btn" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script src="/static/lexicon_admin.js"></script>

</body>
</html>
