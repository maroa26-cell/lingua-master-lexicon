<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <title>Kuingia — Master Lexicon Enterprise</title>
    <link rel="stylesheet" href="/static/style.css">
</head>

<body class="login-body">

    <div class="login-wrapper">
        <!-- LOGO / TITLE -->
        <div class="login-logo">
            <span class="logo-icon">🔐</span>
            <h2>Master Lexicon Admin</h2>
            <p class="login-subtitle">Kuingia kwenye Mfumo wa Usalama wa Enterprise</p>
        </div>

        <!-- LOGIN CARD -->
        <div class="login-card">
            <form method="POST">
                <div class="input-group">
                    <span class="input-icon">👤</span>
                    <input type="text" name="username" placeholder="Jina la Mtumiaji (Username)" required>
                </div>

                <div class="input-group">
                    <span class="input-icon">🔑</span>
                    <input type="password" name="password" placeholder="Nenosiri (Password)" required>
                </div>

                <button type="submit" class="login-btn">➡️ Kuingia</button>

                {% if error %}
                <p class="login-error">{{ error }}</p>
                {% endif %}
            </form>

            <a href="/" class="exit-link">⬅️ Kutoka kwenye Mfumo</a>
        </div>
    </div>

</body>
</html>
