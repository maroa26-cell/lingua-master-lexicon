<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Master Lexicon — Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="/static/style.css">
</head>
<body class="bg-dark text-light">

    <div class="container mt-5">
        <div class="card p-4 mx-auto bg-secondary" style="max-width: 400px;">

            <!-- LOGO BLOCK (IMPROVED) -->
            <div class="text-center mb-4 mt-2">
                <img src="/static/logo.png" class="logo mx-auto d-block" alt="Master Lexicon Logo">
                <h2 class="mt-3 fw-bold">Master Lexicon</h2>
            </div>

            <h4 class="text-center mb-3">Admin Login</h4>

            {% if error %}
                <div class="alert alert-danger">{{ error }}</div>
            {% endif %}

            <form method="POST" action="/login">
                <div class="mb-3">
                    <input type="text" name="username" class="form-control" placeholder="Username" required>
                </div>
                <div class="mb-3">
                    <input type="password" name="password" class="form-control" placeholder="Password" required>
                </div>
                <button class="btn btn-primary w-100">Login</button>
            </form>
        </div>
    </div>

</body>
</html>
